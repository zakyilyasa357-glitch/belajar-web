<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan Font Poppins dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <form class="login-form">
            <h2>Masuk</h2>
            <p class="subtitle">Selamat datang kembali! Silakan masuk ke akun Anda.</p>

            <div class="input-group">
    <label for="email">Email atau Username</label>
    <input type="text" id="email" placeholder="Masukkan email Anda" required>
</div>

            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" placeholder="Masukkan kata sandi" required>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Ingat saya
                </label>
                <a href="#" class="forgot-password">Lupa kata sandi?</a>
            </div>

            <button type="submit" class="btn-login">Masuk</button>

            <p class="register-link">
                Belum punya akun? <a href="#">Daftar sekarang</a>
            </p>
        </form>
    </div>
<!-- Hubungkan file JavaScript di sini -->
    <script src="script.js"></script>
</body>
</html>
